<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Chat · Linn Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-dark: #030014;
        --accent: #00d4ff;
        --accent-2: #a855f7;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
      }

      html, body {
        height: 100%;
        background: var(--bg-dark);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
      }

      header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1.5rem;
        background: rgba(10, 10, 30, 0.9);
        border-bottom: 1px solid rgba(0, 212, 255, 0.15);
        backdrop-filter: blur(8px);
      }

      header .logo-text {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      header .separator {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      header .page-title {
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 1.25rem;
        min-height: 0;
      }

      .iframe-wrapper {
        flex: 1;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(0, 212, 255, 0.12);
        box-shadow: 0 0 40px rgba(0, 212, 255, 0.06), 0 0 80px rgba(168, 85, 247, 0.04);
        min-height: 0;
      }

      .iframe-wrapper iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo-text">LINN GAMES</span>
      <span class="separator">/</span>
      <span class="page-title">Chat</span>
    </header>
    <main>
      <div class="iframe-wrapper">
        <iframe
          src="https://app.langdock.com/workflows/748009ec-6beb-4122-a909-a39867ccd5c3/public-form"
          width="100%"
          height="100%"
          style="border:none"
          sandbox="allow-forms allow-scripts allow-same-origin"
          loading="lazy"
          title="Linn Games Chat"
        ></iframe>
      </div>
    </main>
  </body>
</html>
